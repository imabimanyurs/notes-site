<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YouTube Notes</title>
<style>
body{margin:0;background:#0f1115;color:#e6e6e6;font:16px/1.6 system-ui,sans-serif}
.wrap{max-width:900px;margin:auto;padding:24px}h1{margin:0 0 16px}
input{width:100%;padding:12px;border-radius:10px;border:1px solid #2a2f3a;background:#171a21;color:#fff;font-size:16px;box-sizing:border-box}
.cats{margin:14px 0;display:flex;flex-wrap:wrap;gap:8px}
.cats button{background:#171a21;color:#ccc;border:1px solid #2a2f3a;border-radius:20px;padding:6px 14px;cursor:pointer}
.cats button.on{background:#4f7cff;color:#fff;border-color:#4f7cff}
.card{background:#171a21;border:1px solid #2a2f3a;border-radius:12px;padding:18px;margin:14px 0}
.tag{font-size:12px;color:#8fa8ff}.meta{color:#999;font-size:14px}.pending{color:#d9a54a;font-style:italic}
h2{margin:6px 0;font-size:20px}a{color:#8fa8ff}
</style></head><body><div class="wrap"><h1>📝 YouTube Notes</h1>
<input id="q" placeholder="Search notes..."><div class="cats" id="cats"></div><div id="list"></div></div>
<script src="notes.js"></script><script>
let cat="All";const q=document.getElementById('q');
const cats=["All",...new Set(NOTES.map(n=>n.category))];
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function render(){
 document.getElementById('cats').innerHTML=cats.map(c=>`<button class="${c==cat?'on':''}" onclick="cat='${c}';render()">${c}</button>`).join('');
 const t=q.value.toLowerCase();
 document.getElementById('list').innerHTML=NOTES.filter(n=>(cat=="All"||n.category==cat)&&JSON.stringify(n).toLowerCase().includes(t)).map(n=>`<div class="card"><span class="tag">${n.category}</span><h2>${esc(n.title)}</h2>
 <div class="meta">${n.author?esc(n.author):''}${n.url?` · <a href="${n.url}" target="_blank">Watch</a>`:''}</div>
 ${n.core?`<p><b>Core idea:</b> ${esc(n.core)}</p><b>Key points:</b><ul>${n.points.map(p=>`<li>${esc(p)}</li>`).join('')}</ul>`:'<p class="pending">Summary pending</p>'}</div>`).join('')||'<p>No notes found.</p>';
}
q.oninput=render;render();
</script></body></html>
